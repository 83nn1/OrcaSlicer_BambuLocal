name: Wiki sync

# Publishes the pages in wiki/ to the repository's GitHub wiki. The wiki must be
# enabled and have at least one page, otherwise its git repository does not exist.
on:
  push:
    branches:
      - main
    paths:
      - 'wiki/**'
      - '.github/workflows/wiki_sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == '83nn1/OrcaSlicer_BambuLocal'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: wiki

      - name: Push wiki/ to the wiki repository
        env:
          TOKEN: ${{ github.token }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki_repo
          rsync -a --delete --exclude .git wiki/ wiki_repo/
          cd wiki_repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki is up to date."
            exit 0
          fi
          git commit -m "Sync wiki from ${GITHUB_SHA::8}"
          git push origin HEAD
